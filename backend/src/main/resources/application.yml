spring:
  application:
    name: backend
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      repositories:
        enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pharmadesk}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 60000
      connection-timeout: 20000
      max-lifetime: 180000
      keepalive-time: 30000
      validation-timeout: 3000
      leak-detection-threshold: 60000
      pool-name: PharmaDesk-Pool
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:test@example.com}
    password: ${SPRING_MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:https://pms-pharma-desk-bny2.vercel.app}

jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast32BytesLongForJwt1234567890!}
  expirationMs: 86400000

app:
  url: ${APP_URL:http://localhost:5173}
  backend-health-url: ${BACKEND_HEALTH_URL:}
  keep-alive-enabled: ${KEEP_ALIVE_ENABLED:true}
  stock-alert:
    cooldown-hours: ${STOCK_ALERT_COOLDOWN:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: backend

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  traces-sample-rate: 1.0
